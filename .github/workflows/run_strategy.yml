name: Taiwan Market Multi-Strategy Monitor

on:
  schedule:
    # 💡 台灣時間 (UTC+8) 轉換為 UTC 時間：
    # 1. 08:37 (UTC 00:37) - 盤前/歷史資料
    # 2. 09:47 (UTC 01:47) - 盤中追蹤 1
    # 3. 10:52 (UTC 02:52) - 盤中追蹤 2
    # 4. 11:47 (UTC 03:47) - 盤中追蹤 3
    # 5. 12:37 (UTC 04:37) - 盤中追蹤 4
    # 6. 15:33 (UTC 07:33) - 盤後最終定價總結
    - cron: '37 0,4 * * 1-5'
    - cron: '47 1,3 * * 1-5'
    - cron: '52 2 * * 1-5'
    - cron: '33 7 * * 1-5'
    
  workflow_dispatch: # 保留手動觸發按鈕

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 防止腳本無限卡死消耗 GitHub Actions 免費額度

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run Strategy Scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
