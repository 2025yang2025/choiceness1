name: Taiwan Market Multi-Strategy Monitor

on:
  schedule:
    # 💡 台灣時間與 UTC 時間對照（每週一至週五交易日執行）：
    - cron: '37 0 * * 1-5'   # 1. 台灣時間 08:37 (UTC 00:37)
    - cron: '47 1 * * 1-5'   # 2. 台灣時間 09:47 (UTC 01:47)
    - cron: '52 2 * * 1-5'   # 3. 台灣時間 10:52 (UTC 02:52)
    - cron: '47 3 * * 1-5'   # 4. 台灣時間 11:47 (UTC 03:47)
    - cron: '37 4 * * 1-5'   # 5. 台灣時間 12:37 (UTC 04:37)
    - cron: '33 7 * * 1-5'   # 6. 台灣時間 15:33 (UTC 07:33)

  workflow_dispatch:         # 保留手動點擊執行按鈕

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 防護：防止卡死消耗免費額度

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run Strategy Scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
