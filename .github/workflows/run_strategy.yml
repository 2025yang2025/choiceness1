name: Taiwan Market Multi-Strategy Monitor

on:
  schedule:
    # 💡 台灣與 UTC 時間換算對照表（每週一至週五台股交易日執行）：
    # 1. 早上 08:37 -> UTC 00:37 (開盤前最後試撮、準備期)
    # 2. 早上 09:47 -> UTC 01:47 (盤中即時追蹤 1)
    # 3. 早上 10:52 -> UTC 02:52 (盤中即時追蹤 2)
    # 4. 中午 11:47 -> UTC 03:47 (盤中即時追蹤 3)
    # 5. 中午 12:37 -> UTC 04:37 (盤中即時追蹤 4)
    # 6. 下午 15:33 -> UTC 07:33 (盤後完全定價、策略總結)
    
    - cron: '37 0,4 * * 1-5'   # 觸發 08:37 (UTC 0) 與 12:37 (UTC 4)
    - cron: '47 1,3 * * 1-5'   # 觸發 09:47 (UTC 1) 與 11:47 (UTC 3)
    - cron: '52 2 * * 1-5'     # 觸發 10:52 (UTC 2)
    - cron: '33 7 * * 1-5'     # 觸發 15:33 (UTC 7)

  workflow_dispatch:           # 保留此設定，讓你想手動測試時隨時可以去 GitHub 頁面點擊按鈕執行

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          # 💡 關鍵修正：將 cache: 'pip' 移除，不再強制檢查 requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # 📝 直接在這裡列出你的 Python 程式碼需要的所有套件
          pip install pandas yfinance requests

      - name: Run Strategy Scanner
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scanner.py
